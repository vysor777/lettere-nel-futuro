    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Playfair Display";
        src: url("assets/fonts/PlayfairDisplay-Italic.woff2") format("woff2");
        font-weight: 400 900;
        font-style: italic;
      }

      :root {
        --ink: #0e0d12;
        --paper: #f5f0d0;
        --muted: #8f8a78;
        --accent: #e8b04b;
        --rule: rgba(245, 240, 208, 0.14);
        --glow: rgba(232, 176, 75, 0.16);
        --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --serif: "Playfair Display", Georgia, serif;
        --mono: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--sans);
      }
      #film {
        position: absolute;
        inset: 0;
      }

      /* ── background layers ── */
      .bg-glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 55% 60% at 22% 55%, var(--glow), transparent 70%),
          radial-gradient(ellipse 90% 80% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.55) 100%);
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--rule) 1px, transparent 1px),
          linear-gradient(90deg, var(--rule) 1px, transparent 1px);
        background-size: 120px 120px;
        opacity: 0.35;
      }
      .bg-word {
        position: absolute;
        right: -120px;
        bottom: -150px;
        font-family: var(--serif);
        font-style: italic;
        font-weight: 800;
        font-size: 520px;
        line-height: 1;
        color: var(--paper);
        opacity: 0.045;
        white-space: nowrap;
      }

      /* ── top meta bar ── */
      .meta {
        position: absolute;
        top: 72px;
        left: 160px;
        right: 160px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: var(--mono);
        font-size: 24px;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .meta-rule {
        position: absolute;
        top: 120px;
        left: 160px;
        right: 160px;
        height: 2px;
        background: var(--rule);
        transform-origin: 0 50%;
      }
      .meta-progress {
        position: absolute;
        top: 120px;
        left: 160px;
        width: 1600px;
        height: 2px;
        background: var(--accent);
        transform-origin: 0 50%;
      }
      .counter {
        position: relative;
        width: 200px;
        white-space: nowrap;
        height: 30px;
        text-align: right;
      }
      .counter span {
        position: absolute;
        right: 0;
        top: 0;
      }

      /* ── scenes: full-frame groups inside the one clip ── */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 160px 160px 120px;
        gap: 12px;
      }
      .label {
        font-family: var(--mono);
        font-size: 30px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .voice {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 150px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .emph {
        font-family: var(--serif);
        font-style: italic;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.01em;
      }
      .word {
        display: inline-block;
      }
      /* Scenes and counter states revealed later start hidden. */
      #build,
      #punch,
      #resolve,
      #c2,
      #c3,
      #c4 {
        opacity: 0;
        visibility: hidden;
      }

      #hook .emph {
        font-size: 330px;
      }

      #build {
        flex-direction: row;
        align-items: center;
        gap: 72px;
      }
      .build-rule {
        width: 6px;
        height: 520px;
        background: var(--accent);
        transform-origin: 50% 0;
      }
      .build-copy {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #build .voice {
        font-size: 128px;
      }
      #build .emph {
        font-size: 200px;
      }
      .tag {
        margin-top: 26px;
        font-family: var(--mono);
        font-size: 28px;
        letter-spacing: 0.14em;
        color: var(--muted);
        text-transform: uppercase;
      }

      #punch .voice {
        font-size: 170px;
      }
      #punch .emph {
        font-size: 340px;
        color: var(--accent);
        transform-origin: 0% 80%;
      }

      #resolve {
        gap: 40px;
      }
      .urlbar {
        display: flex;
        align-items: center;
        gap: 26px;
        width: 1120px;
        height: 132px;
        padding: 0 44px;
        border-radius: 66px;
        border: 2px solid var(--rule);
        background: rgba(245, 240, 208, 0.05);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .lock {
        width: 40px;
        height: 48px;
        flex: none;
      }
      .url {
        position: relative;
        font-family: var(--mono);
        font-size: 56px;
        letter-spacing: 0.01em;
        color: var(--paper);
        white-space: nowrap;
      }
      .url .proto {
        color: var(--muted);
      }
      .caret {
        display: inline-block;
        width: 4px;
        height: 60px;
        margin-left: 6px;
        vertical-align: -10px;
        background: var(--accent);
      }
      .lockup {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #resolve .emph {
        font-size: 200px;
      }
      .underline {
        width: 980px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent);
        transform-origin: 0 50%;
      }
      .tagline {
        font-family: var(--sans);
        font-size: 50px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: -0.01em;
      }
