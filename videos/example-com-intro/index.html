<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <!-- GSAP 3.14.2 vendored locally so the render needs no CDN access. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Playfair Display";
        src: url("assets/fonts/PlayfairDisplay-Italic.woff2") format("woff2");
        font-weight: 400 900;
        font-style: italic;
      }

      :root {
        --ink: #0e0d12;
        --paper: #f5f0d0;
        --muted: #8f8a78;
        --accent: #e8b04b;
        --rule: rgba(245, 240, 208, 0.14);
        --glow: rgba(232, 176, 75, 0.16);
        --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --serif: "Playfair Display", Georgia, serif;
        --mono: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--sans);
      }
      #film {
        position: absolute;
        inset: 0;
      }

      /* ── background layers ── */
      .bg-glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 55% 60% at 22% 55%, var(--glow), transparent 70%),
          radial-gradient(ellipse 90% 80% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.55) 100%);
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--rule) 1px, transparent 1px),
          linear-gradient(90deg, var(--rule) 1px, transparent 1px);
        background-size: 120px 120px;
        opacity: 0.35;
      }
      .bg-word {
        position: absolute;
        right: -120px;
        bottom: -150px;
        font-family: var(--serif);
        font-style: italic;
        font-weight: 800;
        font-size: 520px;
        line-height: 1;
        color: var(--paper);
        opacity: 0.045;
        white-space: nowrap;
      }

      /* ── top meta bar ── */
      .meta {
        position: absolute;
        top: 72px;
        left: 160px;
        right: 160px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: var(--mono);
        font-size: 24px;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .meta-rule {
        position: absolute;
        top: 120px;
        left: 160px;
        right: 160px;
        height: 2px;
        background: var(--rule);
        transform-origin: 0 50%;
      }
      .meta-progress {
        position: absolute;
        top: 120px;
        left: 160px;
        width: 1600px;
        height: 2px;
        background: var(--accent);
        transform-origin: 0 50%;
      }
      .counter {
        position: relative;
        width: 200px;
        white-space: nowrap;
        height: 30px;
        text-align: right;
      }
      .counter span {
        position: absolute;
        right: 0;
        top: 0;
      }

      /* ── scenes: full-frame groups inside the one clip ── */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 160px 160px 120px;
        gap: 12px;
      }
      .label {
        font-family: var(--mono);
        font-size: 30px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .voice {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 150px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .emph {
        font-family: var(--serif);
        font-style: italic;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.01em;
      }
      .word {
        display: inline-block;
      }
      /* Scenes and counter states revealed later start hidden. */
      #build,
      #punch,
      #resolve,
      #c2,
      #c3,
      #c4 {
        opacity: 0;
        visibility: hidden;
      }

      #hook .emph {
        font-size: 330px;
      }

      #build {
        flex-direction: row;
        align-items: center;
        gap: 72px;
      }
      .build-rule {
        width: 6px;
        height: 520px;
        background: var(--accent);
        transform-origin: 50% 0;
      }
      .build-copy {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #build .voice {
        font-size: 128px;
      }
      #build .emph {
        font-size: 200px;
      }
      .tag {
        margin-top: 26px;
        font-family: var(--mono);
        font-size: 28px;
        letter-spacing: 0.14em;
        color: var(--muted);
        text-transform: uppercase;
      }

      #punch .voice {
        font-size: 170px;
      }
      #punch .emph {
        font-size: 340px;
        color: var(--accent);
        transform-origin: 0% 80%;
      }

      #resolve {
        gap: 40px;
      }
      .urlbar {
        display: flex;
        align-items: center;
        gap: 26px;
        width: 1120px;
        height: 132px;
        padding: 0 44px;
        border-radius: 66px;
        border: 2px solid var(--rule);
        background: rgba(245, 240, 208, 0.05);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .lock {
        width: 40px;
        height: 48px;
        flex: none;
      }
      .url {
        position: relative;
        font-family: var(--mono);
        font-size: 56px;
        letter-spacing: 0.01em;
        color: var(--paper);
        white-space: nowrap;
      }
      .url .proto {
        color: var(--muted);
      }
      .caret {
        display: inline-block;
        width: 4px;
        height: 60px;
        margin-left: 6px;
        vertical-align: -10px;
        background: var(--accent);
      }
      .lockup {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #resolve .emph {
        font-size: 200px;
      }
      .underline {
        width: 980px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent);
        transform-origin: 0 50%;
      }
      .tagline {
        font-family: var(--sans);
        font-size: 50px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-33ip" id="stage" data-composition-id="main" data-start="0" data-duration="10" data-fps="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-ytth" id="film" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div data-hf-id="hf-4m88" class="bg-glow" id="bg-glow"></div>
        <div data-hf-id="hf-er9m" class="bg-grid" id="bg-grid"></div>
        <div data-hf-id="hf-4a70" class="bg-word" id="bg-word">example</div>

        <div data-hf-id="hf-oie2" class="meta" id="meta">
          <span data-hf-id="hf-ek7m">example.com</span>
          <span data-hf-id="hf-r7ib" class="counter" id="counter">
            <span data-hf-id="hf-xjkk" id="c1">01 / 04</span>
            <span data-hf-id="hf-ctey" id="c2">02 / 04</span>
            <span data-hf-id="hf-odxk" id="c3">03 / 04</span>
            <span data-hf-id="hf-7vcq" id="c4">04 / 04</span>
          </span>
        </div>
        <div data-hf-id="hf-rwyq" class="meta-rule" id="meta-rule"></div>
        <div data-hf-id="hf-j9zw" class="meta-progress" id="meta-progress"></div>

        <!-- 01 Hook -->
        <section data-hf-id="hf-oqy3" class="scene" id="hook">
          <div data-hf-id="hf-7fnu" class="label" id="hook-label">Introducing</div>
          <div data-hf-id="hf-pj8e" class="voice"><span data-hf-id="hf-szir" class="word" id="hook-w1">Example</span></div>
          <div data-hf-id="hf-jjfm" class="emph"><span data-hf-id="hf-pcwk" class="word" id="hook-w2">Domain</span></div>
        </section>

        <!-- 02 Build -->
        <section data-hf-id="hf-fv22" class="scene" id="build">
          <div data-hf-id="hf-zoqa" class="build-rule" id="build-rule"></div>
          <div data-hf-id="hf-bprm" class="build-copy">
            <div data-hf-id="hf-1sw2" class="voice"><span data-hf-id="hf-yw7e" class="word" id="build-w1">Built</span> <span data-hf-id="hf-u4vo" class="word" id="build-w2">for</span></div>
            <div data-hf-id="hf-xkau" class="emph"><span data-hf-id="hf-euto" class="word" id="build-w3">documentation.</span></div>
            <div data-hf-id="hf-30mq" class="tag" id="build-tag">Reserved by RFC 2606 · for illustrative use</div>
          </div>
        </section>

        <!-- 03 Punch -->
        <section data-hf-id="hf-7hxq" class="scene" id="punch">
          <div data-hf-id="hf-2773" class="voice"><span data-hf-id="hf-1xch" class="word" id="punch-w1">No</span> <span data-hf-id="hf-t48u" class="word" id="punch-w2">permission</span></div>
          <div data-hf-id="hf-xylv" class="emph"><span data-hf-id="hf-0qmx" class="word" id="punch-w3">needed.</span></div>
        </section>

        <!-- 04 Resolve -->
        <section data-hf-id="hf-30ua" class="scene" id="resolve">
          <div data-hf-id="hf-sz8i" class="urlbar" id="urlbar">
            <svg data-hf-id="hf-jgfm" class="lock" viewBox="0 0 20 24" aria-hidden="true">
              <rect data-hf-id="hf-4ynv" x="1" y="10" width="18" height="13" rx="3" fill="none" stroke="#8f8a78" stroke-width="2" />
              <path data-hf-id="hf-klsk" d="M5 10 V7 a5 5 0 0 1 10 0 V10" fill="none" stroke="#8f8a78" stroke-width="2" />
            </svg>
            <div data-hf-id="hf-cgat" class="url" id="url"><span data-hf-id="hf-f6ay" class="proto">https://</span>example.com</div>
            <span data-hf-id="hf-fir1" class="caret" id="caret"></span>
          </div>
          <div data-hf-id="hf-6jvi" class="lockup">
            <div data-hf-id="hf-ycww" class="emph"><span data-hf-id="hf-8m6t" class="word" id="resolve-title">example.com</span></div>
            <div data-hf-id="hf-rl4u" class="underline" id="underline"></div>
            <div data-hf-id="hf-81o0" class="tagline" id="tagline">For use in documentation examples.</div>
          </div>
        </section>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ── ambient: background word drifts, glow breathes, progress fills ──
      tl.fromTo("#bg-word", { x: 0 }, { x: -260, duration: 10, ease: "none" }, 0);
      tl.fromTo("#bg-glow", { opacity: 0.6 }, { opacity: 1, duration: 5, ease: "sine.inOut" }, 0);
      tl.fromTo("#meta-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, 0.15);
      tl.fromTo("#meta", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power1.out" }, 0.2);
      tl.fromTo("#meta-progress", { scaleX: 0 }, { scaleX: 1, duration: 9.8, ease: "none" }, 0.2);

      // ── 01 Hook (0 – 2.6s): label tracks in, words build, emphasis slides from left ──
      tl.fromTo(
        "#hook-label",
        { autoAlpha: 0, x: -60 },
        { autoAlpha: 1, x: 0, duration: 0.9, ease: "power3.out" },
        0.2,
      );
      tl.fromTo(
        "#hook-w1",
        { autoAlpha: 0, scale: 1.12, transformOrigin: "0% 100%" },
        { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power2.out" },
        0.35,
      );
      tl.fromTo(
        "#hook-w2",
        { autoAlpha: 0, x: -360 },
        { autoAlpha: 1, x: 0, duration: 0.75, ease: "expo.out" },
        0.6,
      );
      tl.to("#hook", { autoAlpha: 0, y: -40, filter: "blur(10px)", duration: 0.28, ease: "power2.in" }, 2.32);

      // ── 02 Build (2.6 – 5.1s): from the right, rule draws down ──
      tl.set("#build", { autoAlpha: 1 }, 2.6);
      tl.set("#c1", { autoAlpha: 0 }, 2.6);
      tl.set("#c2", { autoAlpha: 1 }, 2.6);
      tl.fromTo("#build-rule", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power4.out" }, 2.62);
      tl.fromTo(
        ["#build-w1", "#build-w2"],
        { autoAlpha: 0, x: 140 },
        { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 },
        2.7,
      );
      tl.fromTo(
        "#build-w3",
        { autoAlpha: 0, x: 220, filter: "blur(14px)" },
        { autoAlpha: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "circ.out" },
        2.95,
      );
      tl.fromTo("#build-tag", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "sine.out" }, 3.5);
      tl.fromTo("#build-w3", { x: 0 }, { x: -24, duration: 1.2, ease: "sine.inOut", immediateRender: false }, 3.6);
      tl.to("#build", { autoAlpha: 0, x: -80, duration: 0.25, ease: "power3.in" }, 4.85);

      // ── 03 Punch (5.1 – 7.5s): hard cut, emphasis slams in ──
      tl.set("#punch", { autoAlpha: 1 }, 5.1);
      tl.set("#c2", { autoAlpha: 0 }, 5.1);
      tl.set("#c3", { autoAlpha: 1 }, 5.1);
      tl.fromTo(
        ["#punch-w1", "#punch-w2"],
        { autoAlpha: 0, y: 60 },
        { autoAlpha: 1, y: 0, duration: 0.22, ease: "power4.out", stagger: 0.06 },
        5.12,
      );
      tl.fromTo(
        "#punch-w3",
        { autoAlpha: 0, scale: 1.45 },
        { autoAlpha: 1, scale: 1, duration: 0.42, ease: "back.out(2.2)" },
        5.3,
      );
      tl.fromTo("#punch-w3", { rotation: 0 }, { rotation: -2.5, duration: 1.6, ease: "sine.inOut", immediateRender: false }, 5.75);
      tl.to("#punch", { autoAlpha: 0, scale: 0.96, duration: 0.24, ease: "power2.in" }, 7.26);

      // ── 04 Resolve (7.5 – 10s): URL bar types, lockup rises, underline sweeps, hold ──
      tl.set("#resolve", { autoAlpha: 1 }, 7.5);
      tl.set("#c3", { autoAlpha: 0 }, 7.5);
      tl.set("#c4", { autoAlpha: 1 }, 7.5);
      tl.fromTo(
        "#urlbar",
        { autoAlpha: 0, scale: 0.94, transformOrigin: "0% 50%" },
        { autoAlpha: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        7.52,
      );
      tl.fromTo(
        "#url",
        { clipPath: "inset(-10px 100% -10px 0)" },
        { clipPath: "inset(-10px 0% -10px 0)", duration: 0.95, ease: "power1.inOut" },
        7.7,
      );
      // The caret starts at the left edge of the address and follows the reveal to its end.
      const urlWidth = document.getElementById("url").offsetWidth;
      tl.fromTo("#caret", { x: -urlWidth }, { x: 0, duration: 0.95, ease: "power1.inOut" }, 7.7);
      tl.fromTo(
        "#resolve-title",
        { autoAlpha: 0, y: 70 },
        { autoAlpha: 1, y: 0, duration: 0.8, ease: "expo.out" },
        8.45,
      );
      tl.fromTo("#underline", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 8.75);
      tl.fromTo("#tagline", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "sine.out" }, 9.05);
      // Caret blinks during the final hold (finite repeats only).
      tl.fromTo(
        "#caret",
        { autoAlpha: 1 },
        { autoAlpha: 0, duration: 0.25, ease: "none", repeat: 3, yoyo: true, repeatDelay: 0.15, immediateRender: false },
        8.7,
      );

      tl.to({}, { duration: 10 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
